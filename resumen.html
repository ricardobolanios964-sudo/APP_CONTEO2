<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/icons/favicon-32.png?v=2.3.0">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/icons/favicon-16.png?v=2.3.0">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/icons/apple-touch-icon.png?v=2.3.0">
    <link rel="manifest" href="manifest.json?v=2.3.0">
    <meta name="theme-color" content="#0D7377">
    <title>Resumen de Conteos - Farmacia Bolaños</title>
    <link rel="stylesheet" href="assets/css/main.css?v=2.3.0">
    <link rel="stylesheet" href="assets/css/menu.css?v=2.3.0">
    <link rel="stylesheet" href="assets/css/resumen.css?v=2.3.0">
</head>
<body>
    
    <div class="dashboard-wrapper">
        
        <div class="conteo-topbar">
            <div class="topbar-row">
                <button class="btn-back" id="btn-back" aria-label="Volver" onclick="window.location.href='dashboard.html'">←</button>
                
                <div class="topbar-title">
                    <span class="topbar-title-main">Resumen</span>
                    <span class="topbar-title-sub">Conteos por Usuario</span>
                </div>
                
                <button class="hamburger-btn" id="hamburger-btn" aria-label="Abrir menú">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
        
        <!-- MENÚ DESPLEGABLE -->
        <div class="dropdown-menu" id="dropdown-menu">
            <div class="dropdown-user">
                <div class="dropdown-user-avatar">👤</div>
                <div>
                    <div class="dropdown-user-name" id="dropdown-usuario-nombre">-</div>
                    <div class="dropdown-user-role">En sesión</div>
                </div>
            </div>
            <div class="dropdown-divider"></div>
            <a href="dashboard.html" class="dropdown-item">
                <span class="dropdown-icon">📋</span> Conteos
            </a>
            <a href="resumen.html" class="dropdown-item">
                <span class="dropdown-icon">📊</span> Resumen de Conteos
            </a>
            <a href="reportes.html" class="dropdown-item">
                <span class="dropdown-icon">🧾</span> Generar Reportes
            </a>
            <div class="dropdown-divider"></div>
            <a href="#" class="dropdown-item dropdown-logout" id="btn-logout">
                <span class="dropdown-icon">🚪</span> Cerrar Sesión
            </a>
        </div>
        <div class="dropdown-overlay" id="dropdown-overlay"></div>
        
        <!-- CONTENIDO -->
        <main class="resumen-main">
            
            <div class="resumen-container">
                
                <!-- FILTRO POR SUCURSAL -->
                <div class="resumen-filter-tabs">
                    <button class="resumen-filter-tab active" data-sucursal="mercado" id="tab-mercado">
                        📦 Mercado
                    </button>
                    <button class="resumen-filter-tab" data-sucursal="farmacia" id="tab-farmacia">
                        💊 Farmacia
                    </button>
                </div>
                
                <!-- CONTENEDOR DE DATOS - se llena vía JS, empieza con skeleton de carga -->
                <div id="resumen-data-container">
                    <div class="resumen-skeleton">
                        <div class="skeleton-block skeleton-total"></div>
                        <div class="skeleton-block skeleton-row"></div>
                        <div class="skeleton-block skeleton-row"></div>
                        <div class="skeleton-block skeleton-row"></div>
                    </div>
                </div>
                
            </div>
            
        </main>
        
    </div>
    
    <script src="assets/js/config.js?v=2.3.0"></script>
    <script src="assets/js/sheets-api.js?v=2.3.0"></script>
    <script src="assets/js/auth.js?v=2.3.0"></script>
    <script src="assets/js/dashboard.js?v=2.3.0"></script>
    <script src="assets/js/resumen.js?v=2.3.0"></script>
    
    <script src="assets/js/pwa-update.js?v=2.3.0"></script>

    <!-- MODAL DE CIERRE DE SESIÓN -->
    <div class="modal logout-modal" id="modal-logout" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="logout-title">
        <div class="modal-content logout-modal-content">
            <div class="logout-icon-wrap" aria-hidden="true">🚪</div>
            <span class="logout-eyebrow">Sesión actual</span>
            <h3 id="logout-title">¿Cerrar sesión?</h3>
            <p class="logout-message">
                Hola, <strong id="logout-user-name">usuario</strong>.<br>
                Si cierras sesión, tendrás que iniciar sesión nuevamente para continuar usando APP CONTEO2.
            </p>
            <div class="logout-actions">
                <button type="button" class="logout-btn-cancel" id="btn-logout-cancel">Seguir en la aplicación</button>
                <button type="button" class="logout-btn-confirm" id="btn-logout-confirm">Cerrar sesión</button>
            </div>
        </div>
    </div>

    <script src="assets/js/logout.js?v=2.3.0"></script>
</body>
</html>
